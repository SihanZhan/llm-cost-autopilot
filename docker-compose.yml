# API service + a background worker for async verification + SQLite - the
# exact architecture the project brief specifies. The API enqueues a job in
# autopilot.db's verification_jobs table (db.enqueue_verification_job) and
# returns immediately; verification-worker is a genuinely separate process
# that polls that table and does the actual re-run-against-top-tier-model +
# score + escalate + log work (eval.verification_worker). retrain-worker is
# an addition beyond the brief's minimum - it automates the classifier
# feedback loop that Phase 3 otherwise left as a manual two-command step.
#
# SQLite isn't a client-server database, so there's no separate "SQLite
# service" here - all three containers share autopilot.db (and routing.yaml,
# classifier/model.joblib, classifier/data/, eval/logs/) by mounting the
# whole repo, so whatever any container writes lands back on the host too.
# That's a dev-oriented tradeoff, not a production pattern; see
# docs/phase5_notes.md.
#
# Ollama (the free llama3 tier-1 model) runs on the host, not in this
# compose file - OLLAMA_HOST below points at host.docker.internal, which
# resolves to the host from inside a container on Docker Desktop
# (Mac/Windows). On Linux you'd need `extra_hosts: ["host.docker.internal:host-gateway"]`
# or to point OLLAMA_HOST at the host's real IP instead.
#
# Usage:
#   docker compose up --build
#   curl http://localhost:8000/health

services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
      # Which requests get verified is risk-based (eval.risk.should_verify:
      # low classifier confidence, an empty/hedging answer, or a small
      # random baseline), not a flat percentage - see
      # docs/risk_based_verification.md. Set FORCE_VERIFY_ALL=1 here to
      # check every non-top-tier request regardless of risk signals. Read
      # here (not in verification-worker) because the API is what decides,
      # per request, whether to enqueue a verification job at all.
      # - FORCE_VERIFY_ALL=1
    volumes:
      - .:/app
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000

  verification-worker:
    build: .
    env_file:
      - .env
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
    volumes:
      - .:/app
    command: python -m eval.verification_worker

  retrain-worker:
    build: .
    env_file:
      - .env
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
      - RETRAIN_INTERVAL_SECONDS=3600
    volumes:
      - .:/app
    command: python -m classifier.retrain_worker
